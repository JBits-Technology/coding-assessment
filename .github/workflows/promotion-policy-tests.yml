name: Promotion Policy Tests

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  test-policy:
    name: Test promotion policy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout regression tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise current promotion policy implementation
        run: |
          python3 scripts/test-promotion-policy.py
